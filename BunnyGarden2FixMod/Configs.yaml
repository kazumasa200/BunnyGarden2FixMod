# Master declaration for all BepInEx Config entries used by FixMod.
# Source of truth — Generated/Configs.g.cs is built from this by tools/ConfigGen.
# Phase 1: section/key/default は既存 .cfg と完全一致を厳守する。
# upstream PR #25 (Refactor Plugin) で section/key が再編成されたため整合済み。
# label は必須・name 直下。生成コードの XML doc コメントと .cfg description の 1 行目に使われる。
# description は label の補足として書く（label と重複する見出し的記述は避ける）。
# type=hotkey は controllerDescription を任意指定でき、Gamepad エントリのみに追記される。
# 文言の統一規約: 単位は label=「(m)」/ description=「（メートル）」。無効状態は「0 で無効。」「OFF で従来動作。」(句点付き)。
# description の本文には内部実装語 (C# フィールド名・型名・メソッド名) を避け、平易な語で書く（必要なら最後に「実装メモ:」で 1 行補足）。

- section: Graphics
  name: 解像度・フレームレート・グラフィック
  configs:
    - name: Width
      label: 解像度幅
      type: int
      default: 1920
      description: 16:9 以外の値を指定すると自動的に最大 16:9 に変換されます。

    - name: Height
      label: 解像度高さ
      type: int
      default: 1080
      description: 16:9 以外の値を指定すると自動的に最大 16:9 に変換されます。

    - name: ExtraWidth
      label: 拡張解像度幅
      type: int
      default: 2560
      description: |
        ゲーム内 OptionMenu の DISPLAY 項目に追加される追加解像度（ウィンドウモード）。既定 2560×1440（WQHD）。
        ウルトラワイド比率を使う設定が ON なら 16:9 より横長の値をそのまま使います（OFF のときや縦長の値は 16:9 に変換）。

    - name: ExtraHeight
      label: 拡張解像度高さ
      type: int
      default: 1440
      description: ウルトラワイド比率を使う設定が ON なら 16:9 より横長の値をそのまま使います（OFF のときや縦長の値は 16:9 に変換）。

    - name: FrameRate
      label: FPS 上限
      type: int
      default: 60
      range: [0, 1000]
      description: 0 で上限を撤廃します。
      ui:
        kind: slider
        step: 1
        format: '{0} fps'

    - name: ForceVSync
      label: VSync を強制 ON
      type: bool
      default: false
      description: |
        QualitySettings.vSyncCount = 1 を強制します。
        フレームレートがモニターのリフレッシュレートに同期され、ティアリングが防止されます。
        有効時は FrameRate 設定より VSync が優先されます。
      ui:
        kind: toggle

    - name: ForceExclusiveFullScreen
      label: 排他的フルスクリーンを強制
      type: bool
      default: false
      description: |
        Windows DWM をバイパスし、複数モニター接続時の FPS 低下が改善される場合があります。
        ウィンドウモード (1080p / 720p) では無効です。
        Alt+Tab でのウィンドウ切り替え時に画面が一瞬暗転する場合があります。
      ui:
        kind: toggle

    - name: AntiAliasing
      label: アンチエイリアシング
      key: AntiAliasingType
      type: enum
      enumType: BunnyGarden2FixMod.AntiAliasingType
      default: MSAA8x
      description: |
        Off / FXAA / TAA / MSAA2x / MSAA4x / MSAA8x。
        右にいくほど画質が向上しますが動作が重くなります。
      ui:
        kind: dropdown

    - name: DisableChromaticAberration
      label: 色収差(画面端のにじみ)を無効化
      type: bool
      default: false
      ui:
        kind: toggle

    - name: DisableDepthOfField
      label: 被写界深度(画面の一部がぼやける効果)を無効化
      type: bool
      default: false
      ui:
        kind: toggle

    - name: FullscreenUltrawideEnabled
      label: ウルトラワイド比率を使う（フルスクリーン / 拡張解像度ウィンドウ）
      type: bool
      default: false
      description: |
        ゲームプレイ中のみ、フルスクリーンではモニターのネイティブ比率、拡張解像度ウィンドウでは拡張解像度の比率で表示します。
        タイトル画面やメニュー画面は従来どおり 16:9 のままです。
      ui:
        kind: toggle

- section: Internal
  hidden: true
  configs:
    - name: ExtraActive
      label: 拡張解像度の使用状態（内部）
      type: bool
      default: false
      description: |
        【内部状態】OptionMenu で拡張解像度 (ExtraWidth×ExtraHeight) を選択中かを記録します。
        ゲーム内オプション操作時に自動更新されます。手動変更しないでください。

- section: Camera
  name: フリーカメラ
  footer: |
    フリーカメラは **F5** キーで ON/OFF、**F6** キーでカメラ固定のトグルができます。
    コントローラーの既定操作は **Select + Y** で ON/OFF、フリーカメラ中は **Select + X** で固定切り替え、**Select + B** で時間停止、**Select + A** でスクリーンショット保存です。
    オーバーレイ表示は **F12** または **Select + Start** で表示／非表示を切り替えられます。

    #### フリーカメラ操作

    | 入力 | 動作 |
    |------|------|
    | **WASD / 矢印キー** | 前後左右に移動 |
    | **Q / E** | 上下に移動 |
    | **Shift / Ctrl** | 高速移動 / 低速移動 |
    | **マウス** | 視点移動 |
    | **T** | 時間停止 ON / OFF |
    | **F** | 時間停止中に 1 フレーム進める |
    | **G** | 押している間だけ早送り（ホールド） |
    | **P** | スクリーンショットを PNG 保存（ゲーム UI・オーバーレイなし） |
    | **F12** | オーバーレイ表示 ON / OFF |
    | **左スティック** | 前後左右に移動 |
    | **右スティック** | 視点移動 |
    | **ZL / ZR** | 下 / 上に移動 |
    | **L / R** | 低速移動 / 高速移動 |
    | **Select + X** | 固定モード ON / OFF |
    | **Select + B** | 時間停止 ON / OFF |
    | **Select + A** | スクリーンショットを PNG 保存 |
    | **Select + Start** | オーバーレイ表示 ON / OFF |

    > **注意**: フリーカメラ中は誤操作を避けるため、既定ではゲーム本体の UI を自動で隠します。終了確認や確認ダイアログが表示された場合は、自動的に UI が復帰し、終了確認ではフリーカメラも自動解除されます。固定モード中は時間停止を有効化できません。スクリーンショットは `BepInEx/screenshots/net.noeleve.BunnyGarden2FixMod/` に PNG で保存されます。
  configs:
    - name: Sensitivity
      label: フリーカメラのマウス感度
      type: float
      default: 10
      range: [0.05, 30.0]
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: Speed
      label: フリーカメラの基本移動速度
      type: float
      default: 2.5
      range: [0.5, 10.0]
      ui:
        kind: slider
        step: 0.1
        format: '{0:F2}'

    - name: FastSpeed
      label: フリーカメラの高速移動速度 (Shift 押下中)
      type: float
      default: 20
      range: [2.0, 60.0]
      ui:
        kind: slider
        step: 0.5
        format: '{0:F1}'

    - name: SlowSpeed
      label: フリーカメラの低速移動速度 (Ctrl 押下中)
      type: float
      default: 0.5
      range: [0.05, 2.0]
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: HideGameUiInFreeCam
      label: フリーカメラ起動中にゲーム本体の Canvas を非表示
      type: bool
      default: true
      ui:
        kind: toggle

    - name: ControllerEnabled
      label: フリーカメラ操作にゲームパッド入力を使用
      type: bool
      default: true
      ui:
        kind: toggle

    - name: FreeCamDisplayMode
      label: フリーカメラの出力先
      type: enum
      enumType: BunnyGarden2FixMod.FreeCamDisplayMode
      default: MainScreen
      description: |
        フリーカメラの映像をどこに表示するかを選択します。
        排他的フルスクリーンモードの場合は、MainScreen が使用されます。
        MainScreen: メイン画面（通常のフリーカメラ）
        PiP: ピクチャー・イン・ピクチャー
        Display2: サブモニター（モニター2台以上のときのみ）
      ui:
        kind: dropdown

- section: Animation
  name: アニメーション
  configs:
    - name: MoreTalkReactions
      label: バーの背景キャスト 2 人の会話リアクションモーションを多様化
      type: bool
      default: false
      ui:
        kind: toggle

    - name: FixAnimationClipping
      label: 一部モーションでスカートが体にめり込む現象を補正
      type: bool
      default: true
      ui:
        kind: toggle

- section: Karaoke
  name: カラオケ（リズムゲーム）
  configs:
    - name: KaraokeNoteSmoothingEnabled
      label: ノーツの動きをなめらかにする
      type: bool
      default: true
      description: |
        タンバリン・サイリウムのノーツ位置は本来オーディオ時刻（約 47Hz 刻み）でしか
        更新されず、高フレームレートでもカクついて見えます。
        ON にすると FPS 上限（FrameRate）と同じレートで滑らかに更新します（0=無制限のときは 120fps 相当）。
        判定タイミングには影響しません。
      ui:
        kind: toggle

    - name: KaraokeHiSpeedEnabled
      label: ハイスピードを有効化
      type: bool
      default: false
      description: |
        ノーツの流れる速さを倍率で変更します（判定タイミングは変わりません）。
        1.0 未満で遅く、1.0 より大きくすると速くなります。
        変更は次の曲から反映されます。
      ui:
        kind: toggle

    - name: KaraokeFastSlowEnabled
      label: FAST / SLOW 判定表示
      type: bool
      default: false
      description: |
        ノーツを叩いたタイミングが正確なタイミングより早いと FAST、遅いと SLOW を表示します。
        最高評価（GREAT）のときと、入力しなかった見逃しには表示しません。
      ui:
        kind: toggle

    - name: KaraokeHiSpeed
      label: ハイスピード倍率
      type: float
      default: 1.0
      range: [0.1, 10.0]
      description: ハイスピード有効時の倍率。変更は次の曲から反映されます。
      ui:
        kind: slider
        step: 0.1
        format: '{0:F1}x'

    - name: KaraokeBpmSyncOffEnabled
      label: 流れる速さの BPM 同期を外す
      type: bool
      default: false
      description: |
        本来ノーツの流れる速さは曲の BPM に比例します（BPM が速い曲ほどノーツも速い）。
        ON にすると全曲の基準速度を「eYe♡とらっかー」と同じ速さに統一します。
        ハイスピード倍率はこの基準に対して掛かります。変更は次の曲から反映されます。
      ui:
        kind: toggle

- section: Cheki
  name: チェキ高解像度保存
  configs:
    - name: ChekiHighResEnabled
      label: 高解像度チェキを有効化
      key: HighResEnabled
      type: bool
      default: false
      description: |
        チェキ（撮影写真）の保存解像度を Size で指定した値に変更します。false で本体既定（320x320）。
        - 互換性: 本体セーブには常に 320x320 版が保存されるため、MOD を外しても主セーブは破損しません。高解像度版は MOD 独自のサイドカーファイル（主セーブ + .exmod）に格納します。
        - 保存先: `BepInEx/data/net.noeleve.BunnyGarden2FixMod/`（Steam Cloud Save 対象外）。PC 移行時はこのフォルダを手動でコピーしてください。
        - スロット対応: セーブスロット単位で高解像度データを分離管理します。
        - 副作用: 高解像度化でメモリ／セーブサイズが増加します（1024 時: 約 48MB/12 枚）。
      ui:
        kind: toggle

    - name: ChekiSize
      label: チェキ解像度
      key: Size
      type: int
      default: 1024
      range: [64, 2048]
      description: |
        正方形サイズ（ピクセル）。HighResEnabled が false の場合は無視されます（本体既定の 320 が使用されます）。
        PNG で実測 1〜5MB/枚 程度に収まります。
      ui:
        kind: slider
        step: 64
        format: '{0} px'

    - name: ChekiFormat
      label: チェキ画像フォーマット
      key: ImageFormat
      type: enum
      enumType: BunnyGarden2FixMod.ChekiImageFormat
      default: PNG
      description: |
        PNG : 無劣化圧縮。サイズ 1/5〜1/20・エンコード 50〜200ms/枚。既定。
        JPG : 劣化圧縮。サイズ 1/20〜1/50・エンコード 30〜100ms/枚。
        エンコードはシャッター時に 1 度のみ走ります。読み込みは magic byte による自動判別です。
      ui:
        kind: dropdown

    - name: ChekiJpgQuality
      label: JPG 品質
      key: JpgQuality
      type: int
      default: 90
      range: [1, 100]
      description: ImageFormat=JPG のときの品質（1〜100）。値が小さいほどサイズは小さく画質は粗くなります。
      ui:
        kind: slider
        step: 1
        format: '{0}'

    - name: EndingChekiSlideshow
      label: エンディング中に撮影済みのチェキをスライドショー表示
      key: ChekiSlideshow
      type: bool
      default: true
      ui:
        kind: toggle

- section: Cheat
  name: チート
  footer: |
    #### キャスト出勤順変更の操作方法

    config で `CastOrder = true` にした上で、ホール画面（バーに入る前）で操作します。

    | キー | 動作 |
    |------|------|
    | **F1** | 編集モード 開始 / 終了 |
    | **W / ↑** | 選択を上に移動 |
    | **S / ↓** | 選択を下に移動 |
    | **1〜6** キー（1回目） | そのキャストを選択（黄色表示） |
    | **1〜6** キー（2回目） | 選択中のキャストと入れ替え |
    | **Esc** | 編集モードを終了 |

    - 画面右上にキャストの現在の並び順が表示されます
    - パネル下部の「**順番を固定する**」チェックボックスをクリックすると、`UpdateTodaysCastOrder` による自動並び替えを無効化できます（固定中は数字キーでの入れ替えも無効）
    - バーに入店した後は変更できません（自動的に編集モードが終了します）
    - 日付が変わった場合も自動的に編集モードが終了します
  configs:
    - name: CastOrder
      label: キャスト出勤順序変更（バー入店前に F1 で編集）
      type: bool
      default: false
      description: F1 で編集モードを開始し、数字キー（1〜6）でキャストを選択・入れ替えます。
      ui:
        kind: toggle

    - name: UltimateSurvivorEnabled
      label: 鉄骨渡りミニゲームで落下しなくなる（チート）
      key: UltimateSurvivor
      type: bool
      default: false
      ui:
        kind: toggle

    - name: GambleAlwaysWinEnabled
      label: ギャンブルで負けなくなる（チート）
      key: GambleAlwaysWin
      type: bool
      default: false
      ui:
        kind: toggle

    - name: GambleAlwaysJackpotEnabled
      label: ギャンブルでジャックポット確定（チート）
      key: GambleAlwaysJackpot
      type: bool
      default: false
      description: ギャンブルのボーナス（ペカリ）演出が必ず発生し、毎回ジャックポット額を獲得します。
      ui:
        kind: toggle

    - name: GambleFastDirectionEnabled
      label: ギャンブルの演出を高速再生（チート）
      key: GambleFastForwardDirection
      type: bool
      default: false
      description: ギャンブル実行時の当落演出を 20 倍速で再生し、結果画面まで素早く進みます。
      ui:
        kind: toggle

    - name: HorseRacingAlwaysWinEnabled
      label: 競馬で賭けた馬が必ず勝つ（チート）
      key: HorseRacingAlwaysWin
      type: bool
      default: false
      description: |
        競馬イベントで、賭けた馬が勝つようにレース結果を書き換えます（大穴に賭ければ大穴が必ず当たります）。
        まだ再生されていない実況・着順発表も勝利に合わせて置き換わります。
        レース中に ON にした場合も、その時点から結果が賭けた馬の勝利へ切り替わります
        （すでに再生された実況はそのままです）。
      ui:
        kind: toggle

    - name: StopTimeProgressionEnabled
      label: 日付の進行を止める（チート・ベータ）
      key: StopTimeProgression
      type: bool
      default: false
      description: |
        【ベータ機能】不具合が残っている可能性があります。
        ON にすると一日を終えても日付（ゲーム内カレンダー）が進まなくなります。
        同じ日を繰り返して好感度・お金稼ぎなどに余裕を持って取り組めます。
        ただし終盤のイベントや衣装デーなど日付に依存して進むものは、
        進めたいときに OFF へ戻してから日を進めてください。
      ui:
        kind: toggle

    - name: CheatLikability
      label: 好感度ヒント表示
      key: Likability
      type: bool
      default: false
      description: |
        会話選択肢・ドリンク・フードの正解をゲーム内に表示します。
        【会話選択肢】選択肢テキストの先頭に記号が追加されます。
          ★ : 好感度UP（正解）
          ▼ : 好感度DOWN（酔い選択肢だが現在の状況では効果なし）
        【ドリンク・フード】アイテムの背景色が変化します。
          緑 : キャストのお気に入り
          黄 : 今日の旬アイテム（ボーナスあり）
          赤 : キャストが嫌いなもの
      ui:
        kind: toggle

    - name: BunnyDrinksEnabled
      label: バニー系ドリンクを常時メニューに追加
      type: bool
      default: false
      description: BUNNY_TRAP / BUNNY_MAX / BUNNY_PUNCH を進行状況に関わらず常時注文可能にします。
      ui:
        kind: toggle


- section: CostumeChanger
  name: 衣装変更
  header: |
    F7 キー（既定）で Wardrobe パネルを開き、表示中のキャストの衣装・パンツ・ストッキングを自由に切り替えることができます。DLC 衣装にも対応しています。
  footer: |
    #### 操作方法

    Wardrobe パネル表示中、以下のキーで操作できます。

    | キー | 動作 |
    |------|------|
    | **A / ←** | 左のタブに切替 |
    | **D / →** | 右のタブに切替 |
    | **W / ↑** | 選択を上に移動 |
    | **S / ↓** | 選択を下に移動 |
    | **Enter** | 選択したアイテムを適用（既に適用中なら解除） |
    | **R** | 全タブの override をリセット |
    | **Esc** | パネルを閉じる |
    | **マウスクリック** | 行をクリックで即適用・解除。キャスト名をクリックで対象切替 |

    - パネル上のカーソル外にある操作はゲームに素通しされます
    - フィッティングルーム動作中はパネルを開けません
    - 複数のキャストが画面に表示されている場合は、パネル上のキャスト名をクリックして対象を切り替えられます
  configs:
    - name: CostumeChangerEnabled
      label: 衣装変更を有効化（要再起動）
      group: 基本設定
      key: Enabled
      type: bool
      default: true
      description: |
        衣装変更 UI とパッチを有効化します。
        OFF→ON でパッチ適用が必要なため、変更は再起動後に反映されます。
      ui:
        kind: toggle

    - name: RespectGameCostumeOverride
      label: ゲーム指定衣装を優先
      group: 基本設定
      type: bool
      default: true
      description: |
        試着室などゲームが特定の衣装を強制するシーンでは MOD 側の衣装変更を一時停止します。
        ゲーム内のイベントと衣装の競合を防げます。
      ui:
        kind: toggle

    - name: CostumeUnlockIgnoreRouteClear
      label: 未クリアキャラの衣装も解放可能にする
      group: 基本設定
      key: UnlockIgnoreRouteClear
      type: bool
      default: false
      description: |
        Wardrobe 設定タブの「すべて解放」を、エンディング未クリアのキャストにも使えるようにします。
        既定（OFF）ではゲーム本来どおり該当キャラのルートをクリアするまで「すべて解放」は使えません
        （1 周目はバニラの印象で遊んでほしいという配慮）。
        ON にすると未クリアのキャラでも全衣装・パンツ・ストッキングを解放できます。
      ui:
        kind: toggle

    - name: PersistCostumeOverrides
      label: 衣装変更状態を保存する
      group: 基本設定
      type: bool
      default: true
      description: |
        Wardrobe で変更した衣装の状態を保存し、ゲーム再起動後も復元します。
        OFF にすると以降の変更は保存されません（既存の保存内容は残るため、ON に戻すと復元されます）。
        Steam Cloud 対象外。
      ui:
        kind: toggle

    - name: SwimWearStocking
      label: 水着+ストッキング適用
      group: 水着・ストッキング
      type: bool
      default: true
      description: |
        水着コスチューム着用中にストッキングを適用できるようにします。
        水着モデルには本来ストッキング用ブレンドシェイプがないため、同キャラの Uniform コスチュームからデータを移植します。

    - name: StockingOffset
      label: ストッキング 押出し量 (m)
      group: 水着・ストッキング
      type: float
      default: 0
      range: [0, 0.01]
      description: |
        水着+ストッキング適用時、ストッキングを肌よりどれだけ外側に出すかを指定します（メートル）。
        値を増やすと水着の食い込みが再現できますが、ストッキングが水着を貫通します。0 で無効。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: StockingSkinShrink
      label: ストッキング 肌押込み量 (m)
      group: 水着・ストッキング
      type: float
      default: 0.001
      range: [0, 0.01]
      description: |
        水着+ストッキング適用時、肌をストッキングよりどれだけ内側に押し込むかを指定します（メートル）。
        肌のチラつき（肌とストッキングの干渉）が見える場合に大きくしてください。
        ただし水着の食い込み演出は弱まります。0 で無効。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: StockingSkinFalloffRadius
      label: ストッキング 肌押込み フェード半径 (m)
      group: 水着・ストッキング
      type: float
      default: 0.001
      range: [0, 0.01]
      description: |
        肌の押し込みを、上半身などとの境界で滑らかにフェードさせる距離です（メートル）。
        境界に段差が見える場合に大きくしてください。0 で無効（境界無視で一様に押し込む）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: StockingShapeFalloffRadius
      label: ストッキング 肌形状フェード半径 (m)
      group: 水着・ストッキング
      type: float
      default: 0.001
      range: [0, 0.01]
      description: |
        ストッキング由来の肌形状補正を、ウエストなどの境界で滑らかにフェードさせる距離です（メートル）。
        境界の段差が気になる場合に大きくしてください。0 で無効（補正は全身一様）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: TopsDistancePreserveRange
      label: 上衣 距離保存 検索範囲 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.100
      range: [0.010, 0.500]
      description: |
        別キャラ上衣を当てたときの体型補正の有効範囲です（メートル）。
        小さくするとワンピース型衣装の下半身が補正されず、大きくしすぎると
        服から遠い箇所まで体に張り付いて不自然になります。
      ui:
        kind: slider
        step: 0.010
        format: '{0:F3}'

    - name: TopsSkinMinOffset
      label: 上衣 肌からの最小距離 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.005
      range: [0.0, 0.010]
      description: |
        元キャラ側で衣装が肌にめり込んでいる箇所を補正する安全マージンです（メートル）。
        当てた服の一部が肌にめり込んで見える場合に大きくしてください。
        0 で無効（めり込みは未補正のまま反映されます）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: TopsSkinSampleRadius
      label: 上衣 肌サンプル半径 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.03
      range: [0.0, 0.100]
      description: |
        体型補正で参照する肌のサンプリング半径です（メートル）。
        鎖骨・肩甲骨など凹凸の多い箇所で補正がばらつく場合に大きくしてください。
        0 で最小近傍 3 点を使用。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F3}'

    - name: TopsSkinWeightFalloff
      label: 上衣 肌 weight 転送 falloff (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.02
      range: [0.0, 0.050]
      description: |
        関節を曲げたときに肌密着部の服が肌から剥離・突き抜けないよう、
        肌の動きに追随させる範囲です（メートル）。
        肩・肘などで服が肌から浮いて見える場合に大きくしてください。
        0 で無効。推奨初期値: 0.020 m。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F3}'

    - name: TopsAdditiveBreastPushOut
      label: 重ね着時 胸 押し出し (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.003
      range: [0.0, 0.030]
      description: |
        水着など全身衣装に上着を重ね、かつ胸サイズを縮めた重ね着のときだけ効く設定です（メートル）。
        重ねた上着の胸まわりを肌から離す向きに押し出し、胸が上着を突き抜けるのを防ぎます。
        突き抜けが見える場合に少しずつ大きくしてください。0 で無効（従来どおり）。
        通常の上下分かれた衣装では使われません（そちらは肌側の押し込みで補正）。
        補正は距離保存の平滑化を通るため、押し出し量は設定値より小さく出ます
        （設定値=実際の押し出し量ではありません）。突き抜けが消える値に合わせてください。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F4}'

    - name: DistancePreserveSmoothIterations
      label: 距離保存 平滑化 反復回数
      group: 上衣 (別キャラ移植)
      type: int
      default: 1
      range: [0, 10]
      description: |
        距離保存で衣装を体型に追従させた際の補正量 (disp) を、衣装メッシュ上で近傍平均する反復回数です。
        胸 flat 時の native 上着・別キャラ上衣の移植いずれにも効きます。
        多いほど表面のガタつき (逆距離² サンプリングの高周波ノイズ) が滑らかになりますが、
        増やしすぎると衣装のディテール (襞・カップの稜線) が鈍ります。0 で平滑化無効 (距離保存の生の結果)。
      ui:
        kind: slider
        step: 1
        format: '{0}'

    - name: DistancePreserveSmoothStrength
      label: 距離保存 平滑化 寄せ率
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.5
      range: [0.0, 1.0]
      description: |
        距離保存 平滑化の 1 反復あたり近傍平均への寄せ率。0.0 で平滑化無効、1.0 で最大。
        ガタつきが残るなら上げ、衣装のディテールが鈍るなら下げます。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: TopsSkinShrink
      label: 上衣 肌押込み量 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0
      range: [0, 0.01]
      description: |
        別キャラ上衣を当てたとき、肌が服を貫通する箇所を内側に押し込む距離です（メートル）。
        肌のチラつき（肌と服の干渉）が見える場合に大きくしてください。0 で無効。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: TopsSkinShrinkFalloffRadius
      label: 上衣 肌押込み フェード半径 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.001
      range: [0, 0.01]
      description: |
        肌の押し込みを、顔・首回りで滑らかにフェードさせる距離です（メートル）。
        首元で押し込みが顔まで波及する場合に大きくしてください。
        0 で無効（顔境界無視で一様に押し込む）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: TopsSkinShrinkSampleRadius
      label: 上衣 肌押込み cloth サンプル半径 (m)
      group: 上衣 (別キャラ移植)
      type: float
      default: 0.0
      range: [0, 0.1]
      description: |
        肌押込みの参照範囲です（メートル）。
        フリル・袖などで押し込みがガタつく場合や、ウエストの縫い目で段差が見える場合に
        大きくしてください。0 で 10mm 固定（狭い既定）。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F3}'

    - name: BottomsSkinShrink
      label: 下衣 肌押込み量 (m)
      group: 下衣 (別キャラ移植)
      type: float
      default: 0.002
      range: [0, 0.01]
      description: |
        別キャラ下衣（スカート等）を当てたとき、肌がスカートを貫通する箇所を内側に押し込む距離です（メートル）。
        腰・腿・膝下のチラつきが見える場合に大きくしてください。
        0 で無効。最大 1cm 制限（過大値で脚が消える事故を防ぐため）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: BottomsSkinShrinkFalloffRadius
      label: 下衣 肌押込み フェード半径 (m)
      group: 下衣 (別キャラ移植)
      type: float
      default: 0.001
      range: [0, 0.01]
      description: |
        肌の押し込みを、顔・首回りで滑らかにフェードさせる距離です（メートル）。
        首元で押し込みが顔まで波及する場合に大きくしてください。
        0 で無効（顔境界無視で一様に押し込む）。
      ui:
        kind: slider
        step: 0.0001
        format: '{0:F4}'

    - name: BottomsSkinShrinkSampleRadius
      label: 下衣 肌押込み skirt サンプル半径 (m)
      group: 下衣 (別キャラ移植)
      type: float
      default: 0.05
      range: [0, 0.1]
      description: |
        肌押込みの参照範囲です（メートル）。
        スカートのフリルなどで押し込みがガタつく場合や、ウエストの縫い目で段差が見える場合に
        大きくしてください。0 で 10mm 固定（狭い既定）。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F3}'

    - name: PantiesAltSlotMatch
      label: 水着・バニーガール衣装でも下着を表示
      group: 下着・その他
      type: bool
      default: true
      description: |
        水着・バニー衣装でもパンツが表示されるようにします（通常はゲーム側の制限で非表示）。
        テクスチャは通常衣装用のため、UV 不一致で見た目が崩れる場合は OFF にしてください。
      ui:
        kind: toggle

    - name: PantiesAltSlotOverrideOnly
      label: Mod で下着を指定したキャストのみ適用
      group: 下着・その他
      type: bool
      default: true
      description: |
        ON  : Mod で下着を選択したキャストのみ適用（他キャストは水着/バニー時に通常通り肌色）。
        OFF : 全キャストに常時適用（水着/バニーでも通常下着が出ます）。
        PantiesAltSlotMatch=OFF のときはこの設定は無視されます。
      ui:
        kind: toggle

    - name: DisableStockings
      label: キャストのストッキング(パンスト)を非表示
      group: 下着・その他
      type: bool
      default: false
      ui:
        kind: toggle

    - name: SkinUpperSeamConform
      label: 上半身肌の腰継ぎ目を元の体型に合わせる
      group: 上半身肌 継ぎ目
      type: bool
      default: true
      description: |
        上着・水着・胸平坦化で上半身肌 (mesh_skin_upper) を共通体型(Babydoll)に差し替えたとき、
        腰の継ぎ目だけ元の体型のボーン追従と位置に戻して、下半身肌との継ぎ目のズレ（動いたときの段差・
        静的な隙間）を抑えます。腰回りでズレや隙間が出る場合は ON のままにしてください。OFF で従来動作。
      ui:
        kind: toggle

    - name: SkinUpperSeamConformDist
      label: 腰継ぎ目 conform 近接距離 (m)
      group: 上半身肌 継ぎ目
      type: float
      default: 0.005
      range: [0.001, 0.02]
      description: |
        上半身肌のうち、共通体型(Babydoll)の下半身肌との距離がこの値（メートル）以内の継ぎ目頂点だけを
        元の体型のボーン追従へ戻します。胸など下半身肌から離れた部分は触らず平坦化を保ちます。
        継ぎ目の段差が残る場合は少し大きくしてください。上半身肌の腰継ぎ目 conform が OFF のときは無効。
      ui:
        kind: slider
        step: 0.001
        format: '{0:F3}'

- section: Breast
  name: 胸 (サイズ・揺れ / 慣性)
  header: |
    ## 胸サイズ可変

    キャストの胸を周囲の肌へ滑らかに沈めて小さく見せる機能です。flat 量 `amount` は `0.0` = 元のサイズ / `1.0` = 完全に平ら。0 のキャラは処理しません。

    沈め方は近傍の肌との位置平均（平滑化）で、その強さを `SmoothRadius`（参照半径）/ `SmoothIterations`（反復回数）/ `SmoothStrength`（寄せ率）で決めます。**いずれかを 0 にすると `amount` を上げても平らになりません**（既定値で有効）。`SmoothRadius` は `amount` を大きくしたときの表面のブレも抑えます。

    **反映タイミング**: F9 パネルで slider を動かすと即時反映されます（肌の平坦化を作り直し、別キャラ上衣の移植中ならその追従補正も同じフレームで再適用）。

    **既知の制約**:
    - 上着は平坦化する前の胸位置を基準に体型補正されるため、`amount` が大きいと上着が胸の位置で浮きます（肌だけ平らになり、上着・物理布はそのまま）。
    - **`BreastWeightShift`（flat 揺れ抑制倍率）を既定の 0.8 より下げる** と、VIP シーン + 別キャラ上衣の移植が重なったとき、胸が大きく動くモーション中に上着が肌に追従しきれず「肌が上着を突き抜けて見える」ことがあります。`BreastWeightShift` を **0.8 以上**（既定）に保てば発生しません（`docs/costume-changer-pitfalls.md` #20 参照）。

    ## 胸物理 (揺れ / 慣性)

    胸の揺れ（MagicaCloth 物理）を、キャストごとに 2 軸の倍率で調整します。各倍率は `1.0`（既定）で標準のまま（変化なし）です。

    - **Jiggle**（揺れ度）: 大きいほどよく揺れ（大振幅）、`0.0` で完全停止。小さいほど揺れにくくなります。
    - **Inertia**（慣性）: 大きいほど慣性が強く、`0.0` で慣性を無視します。大きくしても一定値で頭打ちになります。

    **反映タイミング**: F9 パネルで slider を動かすと即時反映されます。

    > 実装メモ: Jiggle は MagicaCloth の `springPower` / `damping` を `baseline / 倍率`、Inertia は `worldInertia` を `baseline × 倍率` で書き換えます（Inertia は内部 `Clamp(0,1)` で頭打ち）。
  configs:
    - name: BreastFlattenSmoothRadius
      label: 胸 flat smoothing 半径 (m)
      group: 共通設定
      type: float
      default: 0.1
      range: [0.0, 0.2]
      description: |
        胸を潰す Laplacian relaxation の近傍半径 (mesh-local m)。各頂点をこの半径内の頂点の平均位置へ寄せます。
        大きいほど 1 反復で広く平均し速く平らになりますが処理負荷が増加します。0 で flatten 無効。
      ui:
        kind: slider
        step: 0.005
        format: '{0:F4}'

    - name: BreastFlattenSmoothIterations
      label: 胸 flat 反復回数
      group: 共通設定
      type: int
      default: 4
      range: [0, 5]
      description: |
        胸を潰す Laplacian relaxation の反復回数。回数を増やすほど深く沈んで平らになります。
        0 で flatten 無効。SmoothRadius を近傍半径に使うため SmoothRadius=0 でも無効。
        SmoothRadius が小さいと近傍を拾えず効きが弱くなります。
      ui:
        kind: slider
        step: 1
        format: '{0}'

    - name: BreastFlattenSmoothStrength
      label: 胸 flat 寄せ率
      group: 共通設定
      type: float
      default: 0.8
      range: [0.0, 1.0]
      description: |
        Laplacian relaxation の 1 反復あたり近傍平均への寄せ率。0.0 で flatten 無効、1.0 で最大。
        実効強度は頂点ごとの flat 量 (amount×breast weight) で重み付けされ、胸領域外は不動。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: BreastFlattenCleavageShrink
      label: 胸 flat 谷間沈め
      group: 共通設定
      type: float
      default: 1.0
      range: [0.0, 1.0]
      description: |
        BreastFlatten 時、左右の胸の谷間 (cleavage) で衣装が平らな body の上に浮くのを抑えます。
        distance-preserve が保つ「元の丸い胸との距離」を谷間でのみ縮め、衣装を body へ引き下ろします。
        0.0 で従来挙動（縮めない）、1.0 で谷間の衣装を肌へ最大まで沈めます。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: BreastFlattenCleavageWidth
      label: 胸 flat 谷間幅
      group: 共通設定
      type: float
      default: 1.5
      range: [0.0, 1.5]
      description: |
        谷間沈めを効かせる左右の幅。胸の中心間隔に対する比率で、大きいほど胸寄りまで沈めます。
        BreastFlattenCleavageShrink が 0 のときは無効。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: BreastFlattenLowerFade
      label: 胸 flat 下半身衣装を保護
      group: 共通設定
      type: bool
      default: true
      description: |
        全身が 1 枚メッシュの衣装 (水着・バニー等) で胸を潰すとき、下半身側の衣装が一緒に
        変形するのを抑えます。腰のラインから下は元の形のまま据え置きます。OFF で従来動作。
      ui:
        kind: toggle

    - name: BreastFlattenLowerFadeWidth
      label: 胸 flat 下半身保護のフェード幅 (m)
      group: 共通設定
      type: float
      default: 0.05
      range: [0.0, 0.2]
      description: |
        下半身衣装の保護を腰のラインから上へどれだけの幅で滑らかに切り替えるか (mesh-local m)。
        0 で腰のラインちょうどで二値的に切り替え。大きいほど境界がなだらかになります。
        胸 flat 下半身衣装を保護が OFF のときは無効。
      ui:
        kind: slider
        step: 0.005
        format: '{0:F3}'

    - name: KanaBreastFlatten
      label: flat 量
      group: 花奈
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: |
        花奈 の胸 flat 量。0.0 で元 / 1.0 で完全 flat。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: KanaBreastWeightShift
      label: flat 揺れ抑制倍率
      group: 花奈
      type: float
      default: 0.8
      range: [0.0, 1.0]
      description: |
        花奈 の胸 flat 時、潰した胸の揺れを Spine3 へ逃がして抑える強さ（flat 量に対する倍率）。
