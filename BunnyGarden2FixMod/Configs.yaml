- section: General
  name: 全般
  configs:
    - name: SteamLaunchCheck
      label: Steam 経由起動を強制
      type: bool
      default: true
      description: |
        Steam 外から直接起動された場合に Steam 経由で自動的に再起動します。
        デバッグ目的でゲームフォルダに steam_appid.txt（内容: 3443820）を置くとバイパスできます。

    - name: UIScale
      label: MOD UI スケール
      type: float
      default: 1.5
      range: [1.0, 2.0]
      description: |
        Mod 提供の UI（衣装変更 / 設定パネル / 出勤順 など）の表示倍率。ゲーム本体 UI には影響しません。
        変更はパネルを閉じて開き直すと反映されます。
      ui:
        kind: slider
        step: 0.1
        format: '{0:F1}x'

    - name: ContinueVoiceOnTap
      label: タップでボイスを継続
      type: bool
      default: false
      description: |
        会話送り（タップ／オート／スキップ）でボイスを途中停止しません。
        次の台詞のボイスで自然に上書きされるか、最後まで再生されます。
      ui:
        kind: toggle

    - name: ControllerTriggerDeadzone
      label: コントローラ ZL/ZR デッドゾーン
      type: float
      default: 0.35
      range: [0.05, 0.95]
      description: ZL/ZR を押下扱いにするしきい値。トリガーの遊びやドリフトがある場合に上げてください。
      ui:
        kind: slider
        step: 0.05
        format: '{0:F2}'

    - name: ControllerModifier
      label: コントローラ修飾ボタン
      type: enum
      enumType: BunnyGarden2FixMod.Utils.ControllerButton
      default: Select
      description: |
        ホットキーの同時押し用。ゲーム本来のコントローラー操作との競合回避に使用します。

    - name: ScreenshotScale
      label: スクリーンショット解像度倍率
      type: int
      default: 1
      range: [1, 8]
      description: 1 で通常のスクリーンショットと同じ解像度、2 で倍の解像度になります。
      ui:
        kind: slider
        step: 1
        format: '{0}x'

    - name: FastForwardSpeed
      label: 早送り倍率
      type: float
      default: 10
      range: [1, 240]
      description: FastForward ホットキー押下中の Time.timeScale 倍率。
      ui:
        kind: slider
        step: 1
        format: '{0:F0}x'

- section: HideUI
  name: UI 非表示設定
  header: |
    **F9** キーで設定パネルを開き、以下を ON/OFF できます。カーソルがパネル上にある間はマウスクリックや移動・視点操作などのゲーム入力はブロックされます。
  footer: |
    #### 操作方法（F9 パネル）

    | キー | 動作 |
    |------|------|
    | **F9** | パネルを開く / 閉じる |
    | **行をクリック / Space / Enter** | その行の設定をトグル |
    | **↑ / ↓** | 行を選択 |
    | **← / →** | スライダー値の増減 |
    | **Tab / 1〜9** | カテゴリ切替 |
    | **Esc** | パネルを閉じる |
  configs:
    - name: HideMoneyInSpecialScenes
      label: 旅行・特別シーンで所持金 UI を非表示
      key: HideInSpecialScenes
      type: bool
      default: true
      description: |
        対象シーン:
          - 旅行シーン
          - 恋愛に関する特別なシーン
      ui:
        kind: toggle

    - name: HideButtonGuide
      label: 画面下のボタンガイド(操作ヒント)を常時非表示
      type: bool
      default: false
      ui:
        kind: toggle

    - name: HideLikabilityGauge
      label: ラブカウンター(好感度ゲージ)を常時非表示
      type: bool
      default: false
      ui:
        kind: toggle

- section: Hotkey
  name: ホットキー
  configs:
    - name: FreeCamToggle
      label: フリーカメラ ON/OFF
      key: ToggleFreeCam
      type: hotkey
      defaultKey: F5
      defaultButton: Y
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: FixedFreeCamToggle
      label: 固定フリーカメラ ON/OFF
      key: ToggleFixedFreeCam
      type: hotkey
      defaultKey: F6
      defaultButton: X
      description: フリーカメラ起動中にカメラ位置を固定します。フリーカメラ起動中のみ有効。
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: FreeCamDisplayModeToggle
      label: フリーカメラの出力先切替
      key: ToggleFreeCamDisplayMode
      type: hotkey
      defaultKey: F4
      defaultButton: None
      description: FreeCamDisplayMode 設定の値を順番に切り替えます。フリーカメラ起動中のみ有効。
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: OverlayToggle
      label: オーバーレイ表示切替
      key: ToggleOverlay
      type: hotkey
      defaultKey: F12
      defaultButton: Start
      description: フリーカメラの操作ガイドが対象です。
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: CaptureScreenshot
      label: スクリーンショット保存
      type: hotkey
      defaultKey: P
      defaultButton: A
      description: フリーカメラ中にゲーム UI・MOD オーバーレイを写さず BepInEx/screenshots フォルダへ PNG 出力します。
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: TimeStopToggle
      label: 時間停止 ON/OFF
      key: ToggleTimeStop
      type: hotkey
      defaultKey: T
      defaultButton: B
      description: フリーカメラ中の撮影構図決めなどに使用します。
      controllerDescription: ControllerModifier と同時押しが必要です。
      ui:
        kind: keybinding

    - name: FrameAdvance
      label: 1 フレーム送り
      type: hotkey
      defaultKey: F
      defaultButton: None
      description: 時間停止中のみ有効です。
      ui:
        kind: keybinding

    - name: FastForward
      label: 早送りホールド
      type: hotkey
      defaultKey: G
      defaultButton: None
      description: 押している間のみ有効。倍率は FastForwardSpeed で設定。
      ui:
        kind: keybinding

    - name: CostumeChangerShow
      label: 衣装変更 UI 表示
      key: Show
      type: hotkey
      defaultKey: F7
      defaultButton: None
      ui:
        kind: keybinding
